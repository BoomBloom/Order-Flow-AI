[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ofa"
dynamic = ["version"]
description = "Order Flow AI - deterministic quantitative research platform"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies: none, deliberately. The core domain model is built on
# the standard library only. See docs/architecture.md section 13.
dependencies = []

[project.scripts]
# The only console entry point in Phase 0. docs/roadmap.md puts every command
# beyond `ofa version` out of scope.
ofa = "ofa.cli.main:main"

[project.optional-dependencies]
# Pinned, not floated. docs/roadmap.md requires a pinned Phase 0 toolchain, and
# exit criterion 1 requires `make check` to be green on a clean clone: a new
# ruff or mypy release changing a rule would break that through no change of
# ours. Exact pins are the smallest mechanism that delivers this without adding
# a second package manager or a lockfile. Bumping one is a deliberate edit.
dev = [
  "pytest==9.1.1",
  "hypothesis==6.167.1",
  "mypy==2.3.1",
  "ruff==0.16.6",
]

[tool.hatch.version]
path = "src/ofa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ofa"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ofa"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]
files = ["src", "tests"]
# tests/unit/test_money.py and tests/property/test_money.py share a basename.
# Deriving module names from the repository root keeps them distinct without
# adding __init__.py files to the test tree.
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` carries the deterministic Phase 0 artifact generator under
# tests/support/, which the reproducibility test also imports from subprocesses.
pythonpath = ["src", "tests"]
# tests/unit/test_money.py and tests/property/test_money.py share a basename;
# importlib import mode keeps them distinct without __init__.py files.
addopts = "--import-mode=importlib"
