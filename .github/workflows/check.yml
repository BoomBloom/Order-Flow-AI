# Phase 0 verification, from a clean checkout.
#
# This workflow is the evidence for docs/roadmap.md Phase 0 exit criterion 1
# ("`make check` is green on a clean clone") and criterion 6 (the dependency,
# SDK and data guards). It deliberately inherits nothing: no cache, no
# preinstalled toolchain, no `.venv` from a developer machine, no artifact
# prepared by an earlier job. Every run starts from the repository as committed
# and installs exactly the pinned development toolchain.

name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Phase 0 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the supported Python version
        uses: actions/setup-python@v5
        with:
          # Matches requires-python. Deliberately not cached: a cache is a
          # piece of state from an earlier run, and the point of this job is
          # that nothing survives between runs.
          python-version: "3.11"

      - name: Create an isolated environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip

      - name: Install the package and the pinned development toolchain
        run: .ci-venv/bin/python -m pip install -e ".[dev]"

      - name: Record the installed toolchain
        run: .ci-venv/bin/python -m pip freeze

      - name: Verify no market-data SDK reached the environment
        run: |
          .ci-venv/bin/python - <<'PY'
          from importlib.util import find_spec
          forbidden = ["databento", "ccxt", "yfinance", "ib_insync", "polygon"]
          present = [name for name in forbidden if find_spec(name) is not None]
          assert not present, f"market-data SDK installed: {present}"
          print("no market-data SDK present")
          PY

      - name: make check
        run: make check PYTHON=.ci-venv/bin/python

      - name: Phase 0 guards
        run: make guards PYTHON=.ci-venv/bin/python

      - name: ofa version
        run: .ci-venv/bin/ofa version

      - name: Verify ofa version against the checked-out state
        run: |
          .ci-venv/bin/python - <<'PY'
          import json
          import subprocess

          report = json.loads(
              subprocess.run(
                  [".ci-venv/bin/ofa", "version"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          assert report["code_revision"]["revision"] == head, report
          assert report["code_revision"]["state"] == "CLEAN", report
          assert report["package"]["name"] == "ofa", report
          assert report["package"]["version"], report
          assert report["schema_versions"], report
          print("ofa version agrees with the checked-out revision")
          PY

      - name: Verify ofa version is deterministic across processes
        run: |
          .ci-venv/bin/ofa version > /tmp/version-a.json
          .ci-venv/bin/ofa version > /tmp/version-b.json
          cmp /tmp/version-a.json /tmp/version-b.json
          PYTHONHASHSEED=1 .ci-venv/bin/ofa version > /tmp/version-c.json
          PYTHONHASHSEED=12345 .ci-venv/bin/ofa version > /tmp/version-d.json
          cmp /tmp/version-c.json /tmp/version-d.json

      - name: Verify data/ is ignored and untracked
        run: |
          git check-ignore -q data/anything.parquet
          test -z "$(git ls-files data/)"
          test ! -d data
          echo "data/ is ignored, untracked, and absent"

      - name: Verify the working tree is unchanged by the run
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "the verification run modified the repository:"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo "working tree unchanged"
